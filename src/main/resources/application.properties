# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/terrain
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# API Keys
weather.api.key=YOUR_OPENWEATHERMAP_API_KEY
weather.api.url=https://api.openweathermap.org/data/2.5

mapbox.api.key=YOUR_MAPBOX_API_KEY
mapbox.api.url=https://api.mapbox.com/styles/v1/mapbox

stripe.api.key=YOUR_STRIPE_SECRET_KEY
stripe.webhook.secret=YOUR_STRIPE_WEBHOOK_SECRET

# API Rate Limiting
api.rate.limit=60
api.rate.window=60000

# Weather Update Settings
weather.update.interval=1800000
weather.cache.duration=3600000

# Location Service Settings
location.cache.size=100
location.cache.duration=86400000

# Analytics Settings
analytics.report.interval=86400000
analytics.data.retention=2592000000

# Payment Settings
payment.currency=USD
payment.retry.max=3
payment.retry.delay=5000

# Venue Settings
venue.maintenance.check.interval=43200000
venue.capacity.buffer=10
venue.booking.min.hours=1
venue.booking.max.days=30

# Dynamic Pricing Settings
pricing.peak.start=17
pricing.peak.end=22
pricing.peak.multiplier=1.3
pricing.off.peak.multiplier=0.8
pricing.weekend.multiplier=1.25 